<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>自驾等时圈地图</title>
  <meta name="description" content="输入地点或使用当前位置，免费生成自驾可达时间等时圈，无需 API Key。">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260927-10">
</head>
<body>
  <main class="app-shell">
    <section class="panel" aria-label="等时圈控制面板">
      <div class="brand-row">
        <div>
          <p class="eyebrow">DRIVING ISOCHRONE</p>
          <h1>自驾等时圈地图</h1>
        </div>
        <span class="free-badge">多波次道路拟合 · Demo</span>
      </div>

      <p class="subtext">输入地点或使用设备定位，查看不同驾驶时间内可到达的道路网络范围。</p>

      <form id="searchForm" class="search-row">
        <label class="sr-only" for="placeInput">地点</label>
        <input id="placeInput" type="search" autocomplete="off" placeholder="例如：北京国贸 / 武汉大学" required>
        <button class="primary-btn" type="submit">查找</button>
      </form>

      <button id="locateBtn" class="secondary-btn" type="button">
        <span>◎</span> 使用当前位置
      </button>

      <div class="control-block">
        <div class="control-title">
          <span>驾驶时长</span>
          <strong id="durationModeLabel">真实道路网络</strong>
        </div>
        <div class="duration-row">
          <label class="sr-only" for="durationInput">驾驶时长数值</label>
          <input id="durationInput" class="duration-input" type="number" min="1" max="43200" step="1" value="30" inputmode="decimal" aria-label="驾驶时长">
          <label class="sr-only" for="durationUnit">驾驶时长单位</label>
          <select id="durationUnit" class="duration-unit" aria-label="驾驶时长单位">
            <option value="minute" selected>分钟</option>
            <option value="hour">小时</option>
            <option value="day">天</option>
          </select>
        </div>
        <div id="durationHint" class="duration-hint">自由输入时长，最高 30 天。≤60 分钟真实路网；更长时长先进行多轮 60 分钟道路扩散拼接，再按方向增长曲线拟合。</div>
      </div>

      <button id="generateBtn" class="generate-btn" type="button" disabled>生成自驾等时圈</button>

      <div id="placeCard" class="place-card hidden">
        <span class="place-dot"></span>
        <div>
          <small>当前起点</small>
          <div id="placeName"></div>
        </div>
      </div>

      <div id="legend" class="legend hidden" aria-label="图例"></div>

      <div id="status" class="status" role="status" aria-live="polite">请输入地点开始。</div>

      <p class="footnote">底图由 OpenFreeMap / OpenStreetMap 提供；地点搜索由 Nominatim 提供；道路网络等时圈由开源 Valhalla 引擎计算。</p>
    </section>

    <section class="map-wrap">
      <div id="map" aria-label="地图"></div>
      <button id="recenterBtn" class="map-fab hidden" type="button" title="回到起点">⌖</button>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>
  <script src="./app-wavefit-v6.js?v=20260927-10"></script>
</body>
</html>
