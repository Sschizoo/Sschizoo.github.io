<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>自驾等时圈地图</title>
  <meta name="description" content="输入地点或使用当前位置，免费生成自驾可达时间等时圈，无需 API Key。">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3ynx9u4VjMZkP3x0F5pQGi6abG8aE=" crossorigin="">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="panel" aria-label="等时圈控制面板">
      <div class="brand-row">
        <div>
          <p class="eyebrow">DRIVING ISOCHRONE</p>
          <h1>自驾等时圈地图</h1>
        </div>
        <span class="free-badge">免密钥</span>
      </div>

      <p class="subtext">输入地点或使用设备定位，查看不同驾驶时间内可到达的道路网络范围。</p>

      <form id="searchForm" class="search-row">
        <label class="sr-only" for="placeInput">地点</label>
        <input id="placeInput" type="search" autocomplete="off" placeholder="例如：北京国贸 / 武汉大学" required>
        <button class="primary-btn" type="submit">查找</button>
      </form>

      <button id="locateBtn" class="secondary-btn" type="button">
        <span>◎</span> 使用当前位置
      </button>

      <div class="control-block">
        <div class="control-title">
          <span>最长驾驶时间</span>
          <strong id="timeLabel">30 分钟</strong>
        </div>
        <input id="timeRange" type="range" min="10" max="60" step="10" value="30" aria-label="最长驾驶时间">
        <div class="range-labels"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60 min</span></div>
      </div>

      <button id="generateBtn" class="generate-btn" type="button" disabled>生成自驾等时圈</button>

      <div id="placeCard" class="place-card hidden">
        <span class="place-dot"></span>
        <div>
          <small>当前起点</small>
          <div id="placeName"></div>
        </div>
      </div>

      <div id="legend" class="legend hidden" aria-label="图例"></div>

      <div id="status" class="status" role="status" aria-live="polite">请输入地点开始。</div>

      <p class="footnote">地图数据 © OpenStreetMap contributors；地点搜索由 Nominatim 提供；道路网络等时圈由开源 Valhalla 引擎计算。</p>
    </section>

    <section class="map-wrap">
      <div id="map" aria-label="地图"></div>
      <button id="recenterBtn" class="map-fab hidden" type="button" title="回到起点">⌖</button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
